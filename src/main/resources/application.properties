spring.application.name=practice-gradle

# DB \uB0B4\uC6A9\uC744 \uBE0C\uB77C\uC6B0\uC800\uC5D0\uC11C \uBCFC \uC218 \uC788\uB3C4\uB85D H2 \uCF58\uC194\uC744 \uBE0C\uB77C\uC6B0\uC800\uC5D0\uC11C \uC0AC\uC6A9\uD560 \uC218 \uC788\uAC8C \uD5C8\uC6A9
spring.h2.console.enabled=true
# \uC811\uC18D \uC8FC\uC18C\uB97C \uACE0\uC815 (\uAE30\uBCF8\uAC12: /h2-console)
spring.h2.console.path=/h2-console

# DB \uC811\uC18D \uC8FC\uC18C
# 2-1. \uBA54\uBAA8\uB9AC
# \uC560\uD50C\uB9AC\uCF00\uC774\uC158 \uC2E4\uD589 \uC2DC \uB9E4\uBC88 \uC0C8\uB85C\uC6B4 \uC778\uBA54\uBAA8\uB9AC DB \uC0DD\uC131
spring.datasource.url=jdbc:h2:mem:testdb

# 2-2. \uD30C\uC77C
# 1. \uAE30\uC874 mem(\uBA54\uBAA8\uB9AC)\uC5D0\uC11C file(\uD30C\uC77C) \uACBD\uB85C\uB85C \uBCC0\uACBD
# ~/testdb\uB294 \uC0AC\uC6A9\uC790 \uD648 \uB514\uB809\uD1A0\uB9AC\uC5D0 testdb.mv.db \uD30C\uC77C\uC744 \uC0DD\uC131\uD55C\uB2E4\uB294 \uB73B\uC785\uB2C8\uB2E4.
#spring.datasource.url=jdbc:h2:file:~/testdb;AUTO_SERVER=TRUE
# 2. \uD504\uB85C\uC81D\uD2B8 \uB8E8\uD2B8 \uAE30\uC900 \uC0C1\uB300 \uACBD\uB85C \uC124\uC815
# (Git\uC5D0 \uC62C\uB9AC\uACE0 \uC2F6\uC9C0 \uC54A\uB2E4\uBA74 \uC8FC\uB85C \uBE4C\uB4DC \uACB0\uACFC\uBB3C\uC774 \uC800\uC7A5\uB418\uB294 target \uC774\uB098 build \uD3F4\uB354\uB97C \uACBD\uB85C\uB85C \uC7A1\uC2B5\uB2C8\uB2E4.)
# ./build/testdb : \uD504\uB85C\uC81D\uD2B8 \uB0B4 build \uD3F4\uB354 \uC548\uC5D0 testdb.mv.db \uD30C\uC77C\uC744 \uC0DD\uC131\uD569\uB2C8\uB2E4.
#spring.datasource.url=jdbc:h2:file:./build/testdb;AUTO_SERVER=TRUE
#spring.datasource.url=jdbc:h2:file:./build/testdb;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE
# H2 \uBC84\uC804\uC5D0 \uB9DE\uB294 \uBC29\uC5B8 \uBA85\uC2DC (\uC5D0\uB7EC \uBC29\uC9C0\uC6A9)
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 2-3. SQL
# 1. SQL \uC2A4\uD06C\uB9BD\uD2B8 \uC2E4\uD589 \uBAA8\uB4DC \uD65C\uC131\uD654
# \uC11C\uBC84 \uAE30\uB3D9 \uC2DC SQL \uD30C\uC77C\uC744 \uC2E4\uD589\uD558\uB3C4\uB85D \uC124\uC815 (Spring Boot 2.5 \uC774\uC0C1 \uD544\uC218)
#spring.sql.init.mode=always
# 2. [\uC911\uC694] JPA\uC640 SQL \uC2E4\uD589 \uC21C\uC11C \uC870\uC815
# Hibernate\uAC00 \uD14C\uC774\uBE14\uC744 \uBA3C\uC800 \uB9CC\uB4E0 \uD6C4(update), data.sql\uC774 \uC2E4\uD589\uB418\uB3C4\uB85D \uC124\uC815
# Hibernate\uAC00 Entity\uB97C \uBCF4\uACE0 \uD14C\uC774\uBE14\uC744 \uBA3C\uC800 \uB9CC\uB4E0 \uD6C4(update),
# \uADF8 \uB2E4\uC74C\uC5D0 data.sql\uC774 \uC2E4\uD589\uB418\uB3C4\uB85D \uC21C\uC11C\uB97C \uB2A6\uCDA5\uB2C8\uB2E4.
#spring.jpa.defer-datasource-initialization=true

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA \uD14C\uC774\uBE14 \uC0DD\uC131 \uC804\uB7B5
# update: \uAE30\uC874 \uD14C\uC774\uBE14\uC740 \uC720\uC9C0\uD558\uB418, \uC790\uBC14 \uCF54\uB4DC(Entity)\uC758 \uBCC0\uACBD\uC0AC\uD56D\uB9CC \uBC18\uC601\uD569\uB2C8\uB2E4.
spring.jpa.hibernate.ddl-auto=update
